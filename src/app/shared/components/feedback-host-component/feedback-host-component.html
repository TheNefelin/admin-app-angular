@if (errorService.error(); as msg) {
  <app-modal-error-component
    [message]="msg"
    (closed)="errorService.clear()" />
}

@if (successService.toasts().length) {
  <app-toast-success-component
    [toasts]="successService.toasts()"
    (closed)="successService.clear($event)" />
}

@if (confirmService.dialog(); as dialog) {
  <app-modal-confirm-component
    [title]="dialog.title"
    [message]="dialog.message"
    (confirm)="confirmService.accept()"
    (closed)="confirmService.reject()" />
}
