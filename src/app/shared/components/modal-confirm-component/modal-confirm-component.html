<dialog class="modal modal-open modal-bottom sm:modal-middle">
  <div class="modal-box">
    <h3 class="text-lg font-bold text-error">{{ title() }}</h3>
    <p class="py-4 text-secondary">{{ message() }}</p>
    <div class="modal-action flex items-center gap-2">
      <app-button-component
        [icon]="'save'"
        [textBtn]="'Confirmar'"
        (clicked)="confirm.emit()" />

      <app-button-component
        [icon]="'cancel'"
        [textBtn]="'Cancelar'"
        (clicked)="closed.emit()" />
    </div>
  </div>
</dialog>
