<section class="grid gap-2">
  <span class="font-bold text-2xl italic px-2">GUIDES</span>

  <div class="flex justify-between gap-4 bg-base-200 p-4 rounded-2xl border border-base-300 ">
    <app-select-search-component 
      [placeholder]="'Filtrar por Juego'" 
      [items]="computedGameList()"
      [isLoading]="getAllGamesRX.isLoading()" 
      [clearTrigger]="clearTrigger()"
      (selectionChange)="onGameSelected($event)"
      (cleared)="onGameClear()"/>

    <app-button-component 
      [icon]="'clear'" 
      [textBtn]="'Limpiar'"
      (clicked)="onClear()" />  
  </div>

  <header class="flex gap-4 bg-base-200 p-4 rounded-2xl border border-base-300">
    <div class="relative overflow-hidden rounded-md shadow-lg aspect-square max-h-20" >
      <img
        class="w-full h-full object-cover"
        [ngSrc]="selectedGame()?.img_url  ?? '/images/placeholder.webp'"
        [alt]="selectedGame()?.name ?? 'Imagen'" 
        priority
        height="100" width="100" />
    </div>

    <div class="my-auto font-bold text-2xl">
      <h1>
        @if (selectedGame(); as game) {
          {{ game.id }} - {{ game.name }}
        } @else {
          Selecciona un juego
        }
      </h1>
    </div>
  </header>

  <app-pagination-filter-component
    (refreshClick)="onRefreshClick()"
    (filterChange)="onFilterChange($event)"/>    

  <app-pagination-nav-component
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    (prevPage)="prevPage()"
    (nextPage)="nextPage()"/>

  @if (selectedGame()) {
    <app-button-component 
      class="ml-auto"
      [icon]="'create'" 
      [textBtn]="'Guía - Crear Sección'"
      (clicked)="onCreateGuideModal()" />
  }

  <app-guide-list-component
    [isLoading]="getAllDetailByGamePagination.isLoading() && !getAllDetailByGamePagination.hasValue()"
    [guideDetailList]="getAllDetailByGamePagination.value() ?? []" 
    (editGuideModal)="onEditGuideModal($event)"
    (deleteGuide)="onDeleteGuide($event)"
    (createAdventureModal)="onCreateAdventureModal($event)"
    (editAdventureModal)="onEditAdventureModal($event)"
    (deleteAdventure)="onDeleteAdventure($event)"
    (openAdventureImageModal)="onOpenAdventureImageModal($event)"
    (deleteAdventureImage)="onDeleteAdventureImage($event)" />

  @if (selectedGame()) {
    <app-button-component 
      class="ml-auto"
      [icon]="'create'" 
      [textBtn]="'Guía - Crear Sección'"
      (clicked)="onCreateGuideModal()" />
  }

  <app-pagination-nav-component
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    (prevPage)="prevPage()"
    (nextPage)="nextPage()"/>
</section>

@if (showGuideFormModal()) {
  <app-guide-form-component 
    [isLoading]="guide.isSaving()"
    [selectedGuide]="guide.savePayload()"
    (closed)="onCloseGuideModal()"
    (submitted)="onSubmitGuide($event)" />
}

@if (showAdventureFormModal()) {
  <app-adventure-form-component
    [isLoading]="adventure.isSaving()"
    [selectedAdventure]="adventure.savePayload()?.data ?? null"
    (submitted)="onSubmitAdventure($event)"
    (closed)="onCloseAdventureModal()" />
}

@if (showAdventureImageFormModal()) {
  <app-adventure-image-form-component
    [isLoading]="adventureImage.isSaving()"
    (submitted)="onSubmitAdventureImage($event)"
    (closed)="onCloseAdventureImageModal()" />
}
