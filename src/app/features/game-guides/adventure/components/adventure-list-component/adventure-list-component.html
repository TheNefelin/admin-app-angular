<div class=" grid gap-2">
  @for (item of adventureDetailList(); track item.id) {
    <section class="list bg-base-100 rounded-box shadow-md">
      <header class="list-row">
        <div class="text-xs uppercase font-semibold opacity-60">
          <div>Id: {{ item.id }}</div>
          <div>Sort: {{ item.sort_order }}</div>
        </div>
        
        <div>
          <div class="flex items-center gap-2 pb-2">
            @if (item.is_important) {
              <span class="text-success m-0 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 1024 1024">
                  <path d="M0 0h1024v1024H0z" fill="none" />
                  <path fill="currentColor" d="M512 64a448 448 0 1 1 0 896a448 448 0 0 1 0-896m-55.8 536.4l-99.5-99.6a38.4 38.4 0 1 0-54.4 54.3L429.1 682a38.3 38.3 0 0 0 54.3 0l262.4-262.5a38.4 38.4 0 1 0-54.3-54.3z" />
                </svg>
                Importante                                                              
              </span>
            } @else {
              <span class="text-error m-0 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
                  <path d="M0 0h32v32H0z" fill="none" />
                  <path fill="currentColor" d="M16 2C8.2 2 2 8.2 2 16s6.2 14 14 14s14-6.2 14-14S23.8 2 16 2m5.4 21L16 17.6L10.6 23L9 21.4l5.4-5.4L9 10.6L10.6 9l5.4 5.4L21.4 9l1.6 1.6l-5.4 5.4l5.4 5.4z" />
                </svg>
                No Importante
              </span>
            }

            @if (item.is_optional) {
              <span class="text-success m-0 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 1024 1024">
                  <path d="M0 0h1024v1024H0z" fill="none" />
                  <path fill="currentColor" d="M512 64a448 448 0 1 1 0 896a448 448 0 0 1 0-896m-55.8 536.4l-99.5-99.6a38.4 38.4 0 1 0-54.4 54.3L429.1 682a38.3 38.3 0 0 0 54.3 0l262.4-262.5a38.4 38.4 0 1 0-54.3-54.3z" />
                </svg>
                Opcional                                                              
              </span>
} @else {
              <span class="text-error m-0 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
                  <path d="M0 0h32v32H0z" fill="none" />
                  <path fill="currentColor" d="M16 2C8.2 2 2 8.2 2 16s6.2 14 14 14s14-6.2 14-14S23.8 2 16 2m5.4 21L16 17.6L10.6 23L9 21.4l5.4-5.4L9 10.6L10.6 9l5.4 5.4L21.4 9l1.6 1.6l-5.4 5.4l5.4 5.4z" />
                </svg>
                No Opcional
              </span>
            }
          </div>
          <p class="whitespace-pre-wrap">{{ item.description }}</p>
        </div>
        
        <div class="flex gap-2">
          <app-button-component 
            [icon]="'create'"
            [textBtn]="'Cargar Imagen'"
            (onClick)="onOpenAdventureImageModal.emit(item.id)" />          
          <app-button-component 
            [icon]="'edit'"
            (onClick)="onEditAdventureModal.emit(item)" />
          <app-button-component 
            [icon]="'delete'"
            (onClick)="onDeleteAdventure.emit(item)" />
        </div>
      </header>
                
      <footer class="list-row">
        <app-adventure-image-list-component 
          [adventureImageList]="item.images"
          (onDeleteAdventureImage)="onDeleteAdventureImage.emit($event)" />
      </footer>
    </section>
  }
</div>
