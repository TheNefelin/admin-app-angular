<form (ngSubmit)="submit()" class="fieldset bg-base-200 border-base-300 rounded-box border p-4 grid gap-4">
  @if (errorMessage()) {
    <app-message-error-component [message]="errorMessage()"/>
  }

  <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <app-image-picker-component
      [isLoading]="isLoading() || isSaving()"
      [displayImg]="computedGame()?.cover_url ?? null"
      [labelText]="'Imagen de Portada'"
      (onSelectedFile)="onSelectedFile($event)"
      (onDeleteFile)="onDeleteImage.emit()" />

    <div>
      <fieldset class="fieldset">
        <label class="label" for="game-name">Nombre</label>
        <input
          id="game-name"
          #name
          type="text" class="input w-full" placeholder="Nombre"
          [value]="formData().name"
          (input)="updateName(name.value)"
          maxlength="100"
        />
      </fieldset>

      <fieldset class="fieldset">
        <label class="label" for="game-slug">Slug</label>
        <input
          id="game-slug"
          #slug
          type="text" class="input w-full" placeholder="Slug"
          [value]="formData().slug"
          (input)="updateSlug(slug.value)"
          maxlength="100"
        />
      </fieldset>

      <fieldset class="fieldset">
        <label class="label" for="game-release-year">Año de Lanzamiento</label>
        <input
          id="game-release-year"
          #releaseYear
          type="number" class="input w-full" placeholder="2024"
          [value]="formData().release_year"
          (input)="updateReleaseYear(releaseYear.value)"
          min="1900" max="2100"
        />
      </fieldset>

      <fieldset class="fieldset">
        <label class="label" for="game-rating">Rating (1-10)</label>
        <input
          id="game-rating"
          #rating
          type="number" class="input w-full" placeholder="1 - 10"
          [value]="formData().rating"
          (input)="updateRating(rating.value)"
          min="1" max="10" step="1"
        />
      </fieldset>

      <fieldset class="fieldset">
        <label class="label" for="game-sort">Sort Order</label>
        <input
          id="game-sort"
          #sortOrder
          type="number" class="input w-full" placeholder="0"
          [value]="formData().sort_order"
          (input)="updateSortOrder(sortOrder.value)"
          min="0"
        />
      </fieldset>

      <fieldset class="fieldset">
        <label class="label cursor-pointer justify-start gap-2 pt-2">
          <input
            #isEnabled
            type="checkbox" class="checkbox checkbox-primary"
            [checked]="formData().is_enabled"
            (change)="updateIsEnable(isEnabled.checked)"
          />
          Activo
        </label>
      </fieldset>
    </div>
  </section>

  <fieldset class="fieldset">
    <label class="label" for="game-description">Descripción</label>
    <textarea
      id="game-description"
      #description
      class="textarea w-full" placeholder="Descripción"
      [value]="formData().description"
      (input)="updateDescription(description.value)"
      rows="3"
    ></textarea>
  </fieldset>

  <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <fieldset class="fieldset">
      <label class="label">Seleccionar Plataformas</label>
      <app-select-search-component
        [items]="computedPlatformList()"
        [isLoading]="isLoading()"
        [clearTrigger]="clearSelectTrigger()"
        (selectionChange)="onUpdatePlatform($event)"/>

      <app-select-list-component
        [data]="formPlatformList()"
        (onDeleteItem)="onDeletePlatform($event)"/>
    </fieldset>

    <fieldset class="fieldset">
      <label class="label">Seleccionar Generos</label>
      <app-select-search-component
        [items]="computedGenreList()"
        [isLoading]="isLoading()"
        [clearTrigger]="clearSelectTrigger()"
        (selectionChange)="onUpdateGenre($event)"/>

      <app-select-list-component
        [data]="formGenreList()"
        (onDeleteItem)="onDeleteGenre($event)"/>
    </fieldset>
  </section>

  <div class="flex justify-end">
    @if (isLoading()) {
      <div class="flex p-1 w-20">
        <app-loading-component/>      
      </div>  
    } @else {
      <app-button-component
        [icon]="'save'"
        [textBtn]="isEditMode() ? 'Guardar' : 'Crear'"
        (onClick)="submit()" />
    }
  </div>
</form>
