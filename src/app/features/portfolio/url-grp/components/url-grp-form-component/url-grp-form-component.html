<dialog class="modal modal-bottom modal-open sm:modal-middle">
  <div class="modal-box overflow-visible grid gap-2">
    @if (isLoading()) {
      <app-loading-component class="flex justify-center"/>
    } @else {
      <h3 class="text-lg font-bold text-neutral-content text-center">
        {{ isEditMode() ? 'Modificar' : 'Crear' }} Url Grp
      </h3>

      @if (errorMessage()) {
        <app-message-error-component [message]="errorMessage()"/>
      }

      <fieldset class="fieldset">
        <label class="label" for="url-grp-name">Nombre</label>
        <input
          id="url-grp-name"
          #name
          type="text" class="input w-full" placeholder="Nombre"
          [value]="formData().name"
          (input)="updateName(name.value)"
          maxlength="50"
        />
      </fieldset>

      <fieldset class="fieldset">
        <label class="label cursor-pointer justify-start gap-2 pt-2">
          <input
            #isEnabled
            type="checkbox" class="checkbox checkbox-primary"
            [checked]="formData().is_enabled"
            (change)="updateIsEnabled(isEnabled.checked)"
          />
          Activo
        </label>
      </fieldset>

      <div class="modal-action flex gap-2">
        <app-button-component
          [icon]="'create'"
          [textBtn]="isEditMode() ? 'Guardar' : 'Crear'"
          (onClick)="submit()" />

        <app-button-component
          [icon]="'cancel'"
          [textBtn]="'Cancelar'"
          (onClick)="onClose.emit()" />
      </div>
    }
  </div>
</dialog>
